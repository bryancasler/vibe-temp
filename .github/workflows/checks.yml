# Runs the unit tests on every push and pull request. Among them,
# tests/inline.test.mjs fails if styles.css or page-theme.js changed without
# `node tools/inline.mjs`, which would leave the live page on old copies.
name: checks
on:
  push:
  pull_request:
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test tests/*.test.mjs
